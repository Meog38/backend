name: Deploy API to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brainvest-api-production
  cancel-in-progress: false

jobs:
  verify:
    name: Test and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify
        run: mvn --batch-mode --no-transfer-progress clean verify
      - uses: actions/upload-artifact@v4
        with:
          name: brainvest-api-jar
          path: target/brainvest-api-0.1.0-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to EC2 over SSH
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: brainvest-api-jar
          path: dist

      - name: Validate deployment configuration
        shell: bash
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
          API_DOMAIN: ${{ vars.API_DOMAIN }}
          FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ vars.EC2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in EC2_HOST EC2_USER API_DOMAIN FRONTEND_ORIGIN EC2_SSH_PRIVATE_KEY EC2_KNOWN_HOSTS; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing GitHub Actions variable or secret: $name" >&2
              exit 1
            fi
          done
          [[ "$EC2_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "EC2_HOST must be an IP or hostname." >&2; exit 1; }
          [[ "$EC2_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]] || { echo "EC2_USER is invalid." >&2; exit 1; }
          [[ "$API_DOMAIN" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "API_DOMAIN must be a DNS hostname, not an IP or URL." >&2; exit 1; }
          [[ "$FRONTEND_ORIGIN" =~ ^https://[A-Za-z0-9.-]+$ ]] || { echo "FRONTEND_ORIGIN must be the exact HTTPS Lovable origin." >&2; exit 1; }
          getent ahostsv4 "$API_DOMAIN" >/dev/null || { echo "API_DOMAIN must resolve publicly before deployment." >&2; exit 1; }

      - name: Configure pinned SSH access
        shell: bash
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ vars.EC2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/brainvest-ec2.pem
          chmod 600 ~/.ssh/brainvest-ec2.pem
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy release files to EC2
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/brainvest-ec2.pem "$EC2_USER@$EC2_HOST" 'mkdir -p /tmp/brainvest-release'
          scp -i ~/.ssh/brainvest-ec2.pem \
            dist/brainvest-api-0.1.0-SNAPSHOT.jar \
            deploy/deploy-ec2.sh \
            "$EC2_USER@$EC2_HOST:/tmp/brainvest-release/"

      - name: Deploy API, PostgreSQL and HTTPS proxy
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
          API_DOMAIN: ${{ vars.API_DOMAIN }}
          FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/brainvest-ec2.pem "$EC2_USER@$EC2_HOST" \
            "sudo env API_DOMAIN='$API_DOMAIN' FRONTEND_ORIGIN='$FRONTEND_ORIGIN' bash /tmp/brainvest-release/deploy-ec2.sh"

      - name: Verify public HTTPS endpoint
        shell: bash
        env:
          API_DOMAIN: ${{ vars.API_DOMAIN }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error "https://$API_DOMAIN/actuator/health"; then
              echo
              exit 0
            fi
            echo "Waiting for HTTPS and certificate issuance ($attempt/24)..."
            sleep 10
          done
          echo "Public health check failed at https://$API_DOMAIN/actuator/health" >&2
          exit 1
